apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-node-app
  title: Node.js App Scaffold to github
  description: Scaffold a Node.js app and push to github
spec:
  owner: my-team
  type: service
  parameters:
    - title: Provide repository details
      required: [repoName, group]
      properties:
        repoName:
          type: string
          title: Repository name
        group:
          type: string
          title: GitHub Group (namespace)

  steps:
    - id: fetch-base
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{parameters.repoName}}

    - id: publish
      name: Publish to GitHub Repository
      action: publish:github
      input:
        repoUrl: github.com?group=${{ parameters.group }}&project=${{ parameters.repoName }}
        description: Node.js app created via Backstage
        defaultBranch: main

    - id: register
      name: Register component in catalog
      action: catalog:register
      input:
        repoContentsUrl: '{{ steps["publish"].output.repoContentsUrl }}'
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - links:
        title: GitHub Repository
        icon: repo
        url: '{{ steps["publish"].output.remoteUrl }}'
      - title: Open in Backstage
        icon: catalog
        url: '{{ steps["register"].output.entityRef | backstageUrl}}'
